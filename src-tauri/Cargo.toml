[package]
name = "easyt"
version = "2.1.0"
description = "easyT - 轻量级 Windows 划词翻译应用"
authors = ["easyT"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "easyt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# 全局快捷键：阶段6 接入，提供 Ctrl+T 触发翻译
tauri-plugin-global-shortcut = "2"
# 剪贴板管理：阶段7 接入，读取选中文本与恢复原剪贴板内容
tauri-plugin-clipboard-manager = "2"
# 模拟键盘输入：阶段7 接入，模拟 Ctrl+C 触发系统复制
enigo = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
# 异步运行时：rt 用于 spawn_blocking；time 用于重试延迟与登录轮询
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "rt-multi-thread"] }
# HTTP 客户端：stream 用于 SSE 流式响应
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# 统一错误处理（实现 Display / Serialize，向前端友好返回）
thiserror = "1"
# UUID：用于 Qwen 请求 session_id / req_id / device_id
uuid = { version = "1", default-features = false, features = ["v4"] }
# 请求期间的 ticket 内存副本在 Drop 时显式清理
zeroize = { version = "1", features = ["alloc"] }
# Stream trait 扩展：用于 SSE 流式响应消费
futures-util = { version = "0.3", default-features = false, features = ["std"] }
blake3 = "1.8.6"
lru = "0.12.5"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

# Windows API：获取鼠标位置、显示器工作区，以及原子替换凭证文件
# 仅 Windows 平台需要；通过 features 启用所需子集
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
